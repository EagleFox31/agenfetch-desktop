<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgenFetch</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" alt="" />
      <div>
        <strong>AgenFetch</strong>
        <span>Compagnon YouTube</span>
      </div>
    </header>
    <main>
      <p>Envoie la vidéo ouverte vers l’application locale.</p>
      <button id="open-video" type="button">Ouvrir en vidéo <span>↓</span></button>
      <button id="open-audio" class="secondary" type="button">Ouvrir en audio <span>♪</span></button>
      <small id="message">L’application AgenFetch doit être installée.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
