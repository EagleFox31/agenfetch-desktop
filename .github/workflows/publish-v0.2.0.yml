name: Publish AgenFetch v0.2.0

on:
  push:
    branches:
      - release/v0.2.0

permissions:
  contents: read

env:
  RELEASE_TAG: v0.2.0
  RELEASE_TARGET: 772c02bfc760179acaeccfb052e6a43466cf20eb

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout released source
        uses: actions/checkout@v4
        with:
          ref: 772c02bfc760179acaeccfb052e6a43466cf20eb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build installer and extension
        shell: powershell
        run: |
          npm install
          if ($LASTEXITCODE -ne 0) { throw "npm install failed." }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Tests failed." }
          npm run dist:win -- --publish never
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed." }
          & .\scripts\package-extension.ps1

      - name: Generate SHA-256 checksums
        shell: powershell
        run: |
          $assets = Get-ChildItem -LiteralPath release -File | Where-Object { $_.Name -match '^AgenFetch-Setup-.*\.exe$' -or $_.Name -match '^AgenFetch-Extension-.*\.zip$' }
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $lines | Set-Content -LiteralPath release\SHA256SUMS.txt -Encoding ascii

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgenFetch-Windows-v0.2.0-${{ github.run_number }}
          path: |
            release/AgenFetch-Setup-*.exe
            release/AgenFetch-Extension-*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  publish-release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release artifact
        if: steps.release.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: AgenFetch-Windows-v0.2.0-${{ github.run_number }}
          path: release

      - name: Publish v0.2.0
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$RELEASE_TAG"
          release/AgenFetch-Setup-*.exe
          release/AgenFetch-Extension-*.zip
          release/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY"
          --target "$RELEASE_TARGET"
          --generate-notes
          --title "AgenFetch v0.2.0"
