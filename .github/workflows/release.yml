name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publier la GitHub Release après le build"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Tag à publier lors d'un lancement manuel"
        required: false
        default: "v0.3.0"
        type: string
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build installer and extension
        shell: powershell
        run: .\scripts\build-windows.ps1

      - name: Measure packaged application
        shell: powershell
        run: .\scripts\report-build-size.ps1

      - name: Upload application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgenFetch-App-${{ github.run_number }}
          path: |
            release/AgenFetch-Setup-*.exe
            release/AgenFetch-Extension-*.zip
            release/AgenFetch-Deno-Runtime-*.exe
            release/SIZE-REPORT.json
          if-no-files-found: error

  build-subtitle-engine:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0

      - name: Test subtitle engine
        working-directory: subtitle-engine
        run: python -m unittest -v

      - name: Build optional subtitle component
        shell: powershell
        run: .\scripts\build-subtitle-engine.ps1

      - name: Upload subtitle engine
        uses: actions/upload-artifact@v4
        with:
          name: AgenFetch-Subtitle-Engine-${{ github.run_number }}
          path: release/AgenFetch-Subtitle-Engine-*.exe
          if-no-files-found: error

  bundle-release:
    needs: [build-windows, build-subtitle-engine]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AgenFetch-*-${{ github.run_number }}
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum AgenFetch-Setup-*.exe AgenFetch-Extension-*.zip AgenFetch-Subtitle-Engine-*.exe AgenFetch-Deno-Runtime-*.exe > SHA256SUMS.txt

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: AgenFetch-Windows-${{ github.run_number }}
          path: release
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: bundle-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: AgenFetch-Windows-${{ github.run_number }}
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: |
          shopt -s nullglob
          assets=(release/AgenFetch-Setup-*.exe release/AgenFetch-Extension-*.zip release/AgenFetch-Subtitle-Engine-*.exe release/AgenFetch-Deno-Runtime-*.exe release/SHA256SUMS.txt release/SIZE-REPORT.json)
          if [ ${#assets[@]} -lt 6 ]; then
            echo "Missing release assets" >&2
            ls -la release || true
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "AgenFetch $RELEASE_TAG"
          fi
