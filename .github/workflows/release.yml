name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publier la GitHub Release après le build"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Tag manuel (vide = version de package.json)"
        required: false
        default: ""
        type: string
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "package.json"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build installer and extension
        shell: powershell
        run: .\scripts\build-windows.ps1

      - name: Measure packaged application
        shell: powershell
        run: .\scripts\report-build-size.ps1

      - name: Upload application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgenFetch-App-${{ github.run_number }}
          path: |
            release/AgenFetch-Setup-*.exe
            release/AgenFetch-Extension-*.zip
            release/AgenFetch-Deno-Runtime-*.exe
            release/SIZE-REPORT.json
          if-no-files-found: error

  build-subtitle-engine:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0

      - name: Test subtitle engine
        working-directory: subtitle-engine
        run: python -m unittest -v

      - name: Build optional subtitle component
        shell: powershell
        run: .\scripts\build-subtitle-engine.ps1

      - name: Upload subtitle engine
        uses: actions/upload-artifact@v4
        with:
          name: AgenFetch-Subtitle-Engine-${{ github.run_number }}
          path: release/AgenFetch-Subtitle-Engine-*.exe
          if-no-files-found: error

  bundle-release:
    needs: [build-windows, build-subtitle-engine]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AgenFetch-*-${{ github.run_number }}
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum AgenFetch-Setup-*.exe AgenFetch-Extension-*.zip AgenFetch-Subtitle-Engine-*.exe AgenFetch-Deno-Runtime-*.exe > SHA256SUMS.txt

      - name: Record source commit
        working-directory: release
        shell: bash
        run: printf '%s\n' "$GITHUB_SHA" > SOURCE-COMMIT.txt

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: AgenFetch-Windows-${{ github.run_number }}
          path: release
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: bundle-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=${INPUT_TAG:-v$version}" >> "$GITHUB_OUTPUT"

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: AgenFetch-Windows-${{ github.run_number }}
          path: release

      - name: Validate immutable release identity
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.release.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          expected_tag="v$version"

          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $version (expected $expected_tag)." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Published releases are immutable; bump the product version instead of replacing assets." >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/AgenFetch-Setup-*.exe release/AgenFetch-Extension-*.zip release/AgenFetch-Subtitle-Engine-*.exe release/AgenFetch-Deno-Runtime-*.exe release/SHA256SUMS.txt release/SIZE-REPORT.json release/SOURCE-COMMIT.txt)
          if [ ${#assets[@]} -lt 7 ]; then
            echo "Missing release assets" >&2
            ls -la release || true
            exit 1
          fi

          if startsWithTagEvent=false; then :; fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1 || {
              echo "Expected Git tag $RELEASE_TAG is missing." >&2
              exit 1
            }
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "AgenFetch $RELEASE_TAG"
          else
            if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Tag $RELEASE_TAG already exists. Manual publication must use a fresh version." >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "AgenFetch $RELEASE_TAG"
          fi
