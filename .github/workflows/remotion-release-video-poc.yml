name: Remotion release-video POC

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/release-video/**"
      - ".github/workflows/remotion-release-video-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/release-video

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install POC dependencies
        run: npm install --ignore-scripts

      - name: Typecheck composition
        run: npm run typecheck

      - name: Render 24s vertical MP4
        run: npm run render

      - name: Inspect output
        run: ls -lh out/agenfetch-v0.3.1-vertical.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: agenfetch-v0.3.1-remotion-poc
          path: experiments/release-video/out/agenfetch-v0.3.1-vertical.mp4
          if-no-files-found: error
          retention-days: 14
